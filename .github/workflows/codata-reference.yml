name: CODATA original reference acceptance
on:
  push:
    branches: [feature/agent-council-governance]
    paths:
      - 'fetch_codata_reference.py'
      - 'codata_catalog.py'
      - '.github/workflows/codata-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and validate original reference
        run: python fetch_codata_reference.py
      - name: Archive original bytes
        uses: actions/upload-artifact@v4
        with:
          name: codata2022-original
          path: reference_data/codata2022_original.txt
          if-no-files-found: error
