name: Agent Council governance checks
on:
  push:
    paths:
      - 'codata_catalog.py'
      - 'tests/test_codata_catalog.py'
      - 'reference_data/**'
      - 'equation_registry.py'
      - 'quantity_relationships.py'
      - 'projects/paper2/dimensional_validation.py'
      - 'tests/test_equation_registry.py'
      - 'physical_quantities.py'
      - 'unit_conversion.py'
      - 'tests/test_metrology.py'
      - 'physical_constants.py'
      - 'tests/test_physical_constants.py'
      - 'agent_council.py'
      - 'agent_consultation.py'
      - 'agent_review_provenance.py'
      - 'agent_confidentiality.py'
      - 'agent_repair_gate.py'
      - 'agent_local_inventory.py'
      - 'laserstone_windows_acceptance.py'
      - 'local_scientific_bridge.py'
      - 'local_scientific_view.py'
      - 'local_unified_view.py'
      - 'local_unified_site/**'
      - 'tests/test_local_unified_view.py'
      - 'run_laserstone_unified_windows.bat'
      - 'tests/test_local_scientific_view.py'
      - 'tests/test_local_scientific_bridge.py'
      - 'physics_consistency_engine.py'
      - 'run_laserstone_acceptance_windows.bat'
      - 'tests/test_windows_acceptance.py'
      - 'run_agent_inventory_windows.bat'
      - 'tests/test_agent_council.py'
      - 'tests/test_agent_consultation.py'
      - 'tests/test_agent_review_provenance.py'
      - 'tests/test_agent_confidentiality.py'
      - 'tests/test_agent_repair_gate.py'
      - 'tests/test_agent_local_inventory.py'
      - '.github/workflows/agent-council.yml'
  pull_request:
    paths:
      - 'codata_catalog.py'
      - 'tests/test_codata_catalog.py'
      - 'reference_data/**'
      - 'equation_registry.py'
      - 'quantity_relationships.py'
      - 'projects/paper2/dimensional_validation.py'
      - 'tests/test_equation_registry.py'
      - 'physical_quantities.py'
      - 'unit_conversion.py'
      - 'tests/test_metrology.py'
      - 'physical_constants.py'
      - 'tests/test_physical_constants.py'
      - 'agent_council.py'
      - 'agent_consultation.py'
      - 'agent_review_provenance.py'
      - 'agent_confidentiality.py'
      - 'agent_repair_gate.py'
      - 'tests/test_agent_council.py'
      - 'tests/test_agent_consultation.py'
      - 'tests/test_agent_review_provenance.py'
      - 'tests/test_agent_confidentiality.py'
      - 'tests/test_agent_repair_gate.py'
      - '.github/workflows/agent-council.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test equation registry and relationships
        run: python -m unittest discover -s tests -p 'test_equation_registry.py' -v
      - name: Test scientific metrology
        run: python -m unittest discover -s tests -p 'test_metrology.py' -v
      - name: Test CODATA parser
        run: python -m unittest discover -s tests -p 'test_codata_catalog.py' -v
      - name: Test physical constants registry
        run: python -m unittest discover -s tests -p 'test_physical_constants.py' -v
      - name: Run council unit tests
        run: python -m unittest discover -s tests -p 'test_agent_*.py' -v
      - name: Test local scientific bridge
        run: python -m unittest discover -s tests -p 'test_local_scientific_bridge.py' -v
      - name: Test local scientific view
        run: python -m unittest discover -s tests -p 'test_local_scientific_view.py' -v
      - name: Test original unified local UI
        run: python -m unittest discover -s tests -p 'test_local_unified_view.py' -v
      - name: Test Windows acceptance collector (mocked)
        run: python -m unittest discover -s tests -p 'test_windows_acceptance.py' -v
