name: Isolated static preview and governance checks
on:
  pull_request:
    paths:
      - "cloud/site/**"
      - "cloud/huggingface/**"
      - "cloud/governance/**"
      - "cloud/test_preview_static.py"
      - "cloud/test_governance_risk_gate.py"
      - "cloud/test_public_payload_audit.py"
      - ".github/workflows/**"
  push:
    branches: [cloud/release-governance-isolated]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q cloud
      - name: JavaScript syntax verification
        run: node --check cloud/site/i18n.js
      - name: Preview and governance regression
        run: python -m unittest -v cloud.test_preview_static cloud.test_governance_risk_gate cloud.test_public_payload_audit
      - name: Original G23 scientific baseline
        run: python -m unittest -v test_g23_simulation_exchange_contract test_g23_analysis_pipeline
      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real browser smoke test
        run: python cloud/test_browser_smoke.py
      - name: Prepare isolated public payload
        run: python cloud/huggingface/prepare_space.py --output staged-preview
      - name: Scan staged public payload for sensitive content
        run: python cloud/huggingface/audit_public_payload.py staged-preview
      - name: Assert exact public allowlist
        run: python -c "from pathlib import Path; p=Path('staged-preview'); assert {x.name for x in p.iterdir()}=={'README.md','index.html','style.css','i18n.js','icon.svg','manifest.webmanifest'}"
