name: LASERSTONE Stage 4 closure validation

on:
  push:
    branches:
      - integration/stage4-closure-validation
      - main
    paths:
      - 'projects/paper2/**'
      - '.github/workflows/stage4-closure-validation.yml'
  pull_request:
    paths:
      - 'projects/paper2/**'
      - '.github/workflows/stage4-closure-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run full Paper II synthetic test suite
        run: python -m unittest discover -s projects/paper2/tests -p 'test_*.py' -v
      - name: Verify Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: call projects\paper2\run_closure_validation_windows.bat
