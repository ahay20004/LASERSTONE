name: G24 physics regression
on:
  pull_request:
    paths:
      - laser_physics_engine.py
      - physics_consistency_engine.py
      - physics_evidence_engine.py
      - qfactor_engine.py
      - scientific_trace_engine.py
      - scientific_confidence_engine.py
      - constants.py
      - final_decision_engine.py
      - data_validator.py
      - test_g24_*.py
      - projects/paper2/evidence_uncertainty_audit.py
      - projects/paper2/tests/test_evidence_uncertainty_audit.py
      - .github/workflows/g24-physics-validation.yml
  push:
    branches: [g24/laser-physics-validation]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_g24_laser_physics test_g24_physical_evidence test_g24_fluorescence_evidence test_g24_qfactor test_g24_scientific_trace test_g24_scientific_confidence test_g24_final_decision test_g24_integrated_evidence

      - run: python -m unittest discover -s projects/paper2/tests -p test_evidence_uncertainty_audit.py -v
