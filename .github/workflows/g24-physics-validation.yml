name: G24 physics regression
on:
  pull_request:
    paths:
      - laser_physics_engine.py
      - physics_consistency_engine.py
      - physics_evidence_engine.py
      - qfactor_engine.py
      - scientific_trace_engine.py
      - scientific_confidence_engine.py
      - constants.py
      - final_decision_engine.py
      - main.py
      - safe_dashboard_launcher.py
      - data_validator.py
      - test_g24_*.py
      - projects/paper2/evidence_uncertainty_audit.py
      - projects/paper2/tests/test_evidence_uncertainty_audit.py
      - .github/workflows/g24-physics-validation.yml
  push:
    branches: [g24/laser-physics-validation]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_g24_laser_physics test_g24_physical_evidence test_g24_fluorescence_evidence test_g24_qfactor test_g24_scientific_trace test_g24_scientific_confidence test_g24_final_decision test_g24_integrated_evidence test_g24_fluorescence_uncertainty test_g24_threshold_q_uncertainty test_g24_runtime_gate

      - run: python -m unittest discover -s projects/paper2/tests -p test_evidence_uncertainty_audit.py -v

      - run: python -m py_compile main.py safe_dashboard_launcher.py dashboard_city.py dashboard.py laserstone_governor.py report_generator.py

      - run: python -m unittest -v test_g24_real_pipeline

      - run: python -m unittest discover -s tests -p test_agent_council.py -v

      - run: python -m unittest discover -s tests -p test_unified_scientific_engine.py -v
      - run: python -m unittest discover -s tests -p test_local_unified_view.py -v

      - run: python -m py_compile resource_catalog.py resource_integrity.py resource_preflight.py release_checkpoint.py release_launch.py
      - run: python resource_preflight.py

      - run: python -m unittest discover -s tests -p test_council_workspace.py -v

      - run: python -m py_compile council_dialog.py council_workspace.py

      - run: python -m unittest discover -s tests -p test_measurement_uncertainty.py -v
      - run: python -m unittest discover -s tests -p test_equation_registry.py -v
      - run: python -m unittest discover -s tests -p test_equation_domain_gate.py -v

      - run: python -m unittest discover -s projects/hasabo -p test_physics_checks.py -v

      - run: python -m unittest discover -s tests -p test_agent_confidentiality.py -v
      - run: python -m unittest discover -s tests -p test_agent_review_provenance.py -v
      - run: python -m unittest discover -s tests -p test_agent_repair_gate.py -v

      - name: Windows launcher check
        if: runner.os == 'Windows'
        shell: cmd
        run: run_laserstone_unified_windows.bat --check
