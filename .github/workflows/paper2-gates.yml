name: Paper II G3 and G4 checks

on:
  push:
    branches:
      - paper2/physics-constrained-spectral-evidence
    paths:
      - 'projects/paper2/**'
      - '.github/workflows/paper2-gates.yml'
  pull_request:
    paths:
      - 'projects/paper2/**'
      - '.github/workflows/paper2-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper2-gates-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Compile G3, G4 and tests
        run: python -m compileall -q projects/paper2/gate_g3.py projects/paper2/gate_g4.py projects/paper2/tests
      - name: Run G3 and G4 synthetic tests
        run: python -m unittest discover -s projects/paper2/tests -p 'test_*.py' -v
      - name: Demonstrate absorption-only claim boundaries
        run: python projects/paper2/gate_g3.py --evidence absorption --out /tmp/paper2-g3
