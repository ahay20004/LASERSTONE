name: Deploy LASERSTONE static preview to Hugging Face

on:
  workflow_dispatch:
    inputs:
      decision:
        description: 'Owner publication decision'
        required: true
        type: choice
        options:
          - approve
          - approve_with_changes
          - reject
      approved_sha:
        description: 'Exact reviewed 40-character commit SHA (required for approve)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: huggingface-laserstone-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ahay20004/LASERSTONE' && github.ref == 'refs/heads/cloud/release-governance-isolated' && github.event.inputs.decision == 'approve'
    runs-on: ubuntu-24.04
    environment: huggingface-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.inputs.approved_sha }}
      - name: Verify owner-approved immutable revision
        env:
          APPROVED_SHA: ${{ github.event.inputs.approved_sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          sha = os.environ['APPROVED_SHA']
          assert re.fullmatch(r'[0-9a-fA-F]{40}', sha), 'Full commit SHA required'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual.lower() == sha.lower(), 'Reviewed SHA does not match checkout'
          branch_head = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/cloud/release-governance-isolated'], text=True).split()[0]
          assert actual == branch_head, 'Approved revision is not current development branch HEAD; re-review required'
          print('Approved current development revision:', actual)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preview
        run: python -m unittest -v cloud/test_preview_static.py
      - name: Verify scientific pipeline and frozen legacy baseline
        run: |
          python -m compileall -q .
          python -m unittest -v test_g23_analysis_pipeline test_g23_simulation_exchange_contract cloud.test_governance_risk_gate
      - name: Stage only approved static files
        run: python cloud/huggingface/prepare_space.py --output /tmp/laserstone-hf-preview
      - name: Audit exact staged public payload
        run: python cloud/huggingface/audit_public_payload.py /tmp/laserstone-hf-preview
      - name: Verify isolated deployment allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          folder = Path('/tmp/laserstone-hf-preview')
          allowed = {'README.md', 'index.html', 'style.css', 'i18n.js', 'icon.svg', 'manifest.webmanifest'}
          actual = {p.name for p in folder.iterdir()}
          assert actual == allowed, f'Unexpected public assets: {actual ^ allowed}'
          assert all(p.is_file() and not p.is_symlink() for p in folder.iterdir())
          print('Static-only public deployment allowlist verified')
          PY
      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub>=0.26,<2"
      - name: Upload static preview to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Missing HF_TOKEN secret in huggingface-preview environment")
          HfApi(token=token).upload_folder(
              folder_path="/tmp/laserstone-hf-preview",
              repo_id="LASERSTONE/scientific-preview",
              repo_type="space",
              commit_message="Deploy reviewed LASERSTONE bilingual static preview",
          )
          print("Hugging Face upload requested; verify the Space App tab and revision.")
          PY
